<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নাম দেশ ফুল ফল - মাল্টিপ্লেয়ার গেম</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html { height: 100%; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1e3c72, #2a5298); color: #333; }
        .main-container { max-width: 600px; height: 100vh; margin: auto; display: flex; flex-direction: column; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.3); }
        .header-bar { background: #ff4757; color: white; padding: 15px; text-align: center; font-size: 22px; font-weight: bold; letter-spacing: 1px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .content-area { padding: 15px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .center-box { text-align: center; margin: auto; width: 100%; }
        .input-group input, .input-group select { padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; width: 100%; max-width: 320px; text-align: center; margin-bottom: 12px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #2ed573; }
        .btn { background-color: #2ed573; color: white; padding: 12px; font-size: 16px; border: none; border-radius: 8px; width: 100%; max-width: 320px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-room { background-color: #1e90ff; }
        .timer-box { font-size: 18px; font-weight: bold; color: #ff4757; text-align: center; background: #ffeaa7; padding: 10px; border-radius: 8px; border: 1px dashed #fdcb6e; }
        .letter-banner { font-size: 24px; font-weight: bold; color: #fff; background: #9b59b6; text-align: center; padding: 10px; border-radius: 8px; }
        .game-inputs { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .game-inputs input { padding: 12px; border: 2px solid #dfe6e9; border-radius: 8px; font-size: 15px; text-align: center; outline: none; background: #f8f9fa; }
        .game-inputs input:focus { border-color: #0984e3; background: #fff; }
        table.score-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table.score-table th, table.score-table td { border: 1px solid #dfe6e9; padding: 10px; text-align: center; font-size: 14px; }
        table.score-table th { background-color: #f1f2f6; color: #2f3640; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="main-container">
    <div class="header-bar">🎮 নাম দেশ ফুল ফল</div>
    
    <div class="content-area">
        <!-- Home Screen -->
        <div id="home-screen" class="center-box">
            <h3 style="color: #2f3640;">খেলার জন্য নাম ও রুম কোড দিন</h3>
            <div class="input-group">
                <input type="text" id="player-name-input" placeholder="আপনার নাম"><br>
                <input type="text" id="room-code-input" placeholder="রুম কোড (যেমন: 123)"><br>
                <select id="round-time-input">
                    <option value="30">৩০ সেকেন্ড (ফাস্ট)</option>
                    <option value="60" selected>৬০ সেকেন্ড (স্ট্যান্ডার্ড)</option>
                    <option value="90">৯০ সেকেন্ড (ধীরে-সুস্থে)</option>
                </select>
            </div>
            <button class="btn btn-room" onclick="joinGameRoom()">রুমে প্রবেশ করুন</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden" style="display: flex; flex-direction: column; gap: 15px;">
            <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; color: #555;">
                <span>খেলোয়াড়: <span id="display-player-name" style="color: #1e90ff;"></span></span>
                <span>রুম: <span id="display-room-code" style="color: #ff4757;"></span></span>
            </div>

            <div class="letter-banner">চলতি অক্ষর: <span id="current-letter">-</span></div>
            <div class="timer-box">সময় বাকি: <span id="timer">60</span> সেকেন্ড</div>

            <div class="game-inputs">
                <input type="text" id="input-name" placeholder="নাম (Name)">
                <input type="text" id="input-country" placeholder="দেশ (Country)">
                <input type="text" id="input-flower" placeholder="ফুল (Flower)">
                <input type="text" id="input-fruit" placeholder="ফল (Fruit)">
                <input type="text" id="input-things" placeholder="জিনিস (Things)">
            </div>
            <button class="btn" onclick="submitData()">উত্তর জমা দিন</button>

            <div>
                <h4 style="margin-bottom: 5px; color: #2f3640;">স্কোরবোর্ড ও লাইভ উত্তর:</h4>
                <table class="score-table">
                    <thead>
                        <tr><th>খেলোয়াড়</th><th>উত্তরসমূহ</th><th>পয়েন্ট</th></tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let playerName = '', roomCode = '', timerInterval;

    function joinGameRoom() {
        playerName = document.getElementById('player-name-input').value.trim();
        roomCode = document.getElementById('room-code-input').value.trim();
        const selectedTime = document.getElementById('round-time-input').value;

        if(!playerName || !roomCode) { alert('নাম ও রুম কোড দিন!'); return; }
        
        document.getElementById('display-player-name').innerText = playerName;
        document.getElementById('display-room-code').innerText = roomCode;
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        socket.emit('join_room', { name: playerName, room: roomCode, time: selectedTime });
        startTimer(selectedTime);
    }

    function startTimer(duration) {
        let timer = duration, seconds;
        clearInterval(timerInterval);
        document.getElementById('current-letter').innerText = 'ক'; // ডিফল্ট বা রেন্ডম অক্ষর
        timerInterval = setInterval(() => {
            seconds = parseInt(timer % 60, 10);
            document.getElementById('timer').textContent = seconds;
            if (--timer < 0) {
                clearInterval(timerInterval);
                alert('এই রাউন্ডের সময় শেষ!');
            }
        }, 1000);
    }

    function submitData() {
        const n = document.getElementById('input-name').value.trim() || '-';
        const c = document.getElementById('input-country').value.trim() || '-';
        const f = document.getElementById('input-flower').value.trim() || '-';
        const fr = document.getElementById('input-fruit').value.trim() || '-';
        const t = document.getElementById('input-things').value.trim() || '-';
        
        // ম্যানুয়াল পয়েন্ট প্লেয়ার ইনপুট নেওয়ার অপশন বা ডিফল্ট ক্যালকুলেশন
        let manualPts = prompt("আপনার প্রাপ্ত পয়েন্ট নিজে যাচাই করে লিখুন (যেমন: 10, 20, 50):", "50");
        let pts = parseInt(manualPts) || 0;
        
        socket.emit('submit_row', { room: roomCode, player: playerName, details: `নাম: ${n}, দেশ: ${c}, ফুল: ${f}, ফল: ${fr}, জিনিস: ${t}`, points: pts });
        alert('আপনার উত্তর সফলভাবে জমা হয়েছে!');
    }

    socket.on('update_board', (data) => {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML += `<tr><td style="font-weight:bold; color:#1e90ff;">${data.player}</td><td style="text-align:left; font-size:12px;">${data.details}</td><td style="font-weight:bold; color:#2ed573;">${data.points}</td></tr>`;
    });
</script>
</body>
</html>
