<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নাম দেশ ফুল ফল - আল্টিমেট গেমিং এডিশন</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html { height: 100%; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #fff; overflow-x: hidden; }
        
        /* Force Landscape/Full Gaming View Container */
        .main-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        
        /* Card Boxes */
        .game-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 25px; border-radius: 15px; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        
        h1, h2, h3 { margin-top: 0; color: #f1c40f; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: rgba(0,0,0,0.3); border: 1px solid #7f8c8d; border-radius: 8px; color: #fff; font-size: 16px; text-align: center; outline: none; }
        input::placeholder { color: #bdc3c7; }
        
        .btn { width: 100%; padding: 12px; margin: 10px 0; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
        .btn:hover { background: #c0392b; transform: translateY(-2px); }
        .btn-blue { background: #3498db; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4); }
        .btn-blue:hover { background: #2980b9; }
        
        .hidden { display: none !important; }
        
        /* Intro Animation */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .animate-intro { animation: fadeIn 1s ease-in-out; }
    </style>
</head>
<body>

<div class="main-container">

    <!-- ۱. ইন্ট্রো স্ক্রিন -->
    <div id="intro-screen" class="game-card animate-intro">
        <h1>🎮 নাম দেশ ফুল ফল</h1>
        <p style="color: #ecf0f1; font-size: 14px; margin-bottom: 20px;">ক্লাসিক খাতা-কলম গেমের আধুনিক মাল্টিপ্লেয়ার রূপ!</p>
        <button class="btn" onclick="showProfileScreen()">খেলা শুরু করুন</button>
    </div>

    <!-- ২. প্রোফাইল সেটআপ স্ক্রিন -->
    <div id="profile-screen" class="game-card hidden animate-intro">
        <h2>প্রোফাইল তৈরি করুন</h2>
        <input type="text" id="p-name" placeholder="আপনার নাম লিখুন">
        <input type="number" id="p-age" placeholder="বয়স (যেমন: 24)" value="24">
        <select id="p-gender">
            <option value="Male">পুরুষ (Male)</option>
            <option value="Female">মহিলা (Female)</option>
            <option value="Other">অন্যান্য</option>
        </select>
        <button class="btn btn-blue" onclick="saveProfile()">পরবর্তী ধাপ</button>
    </div>

    <!-- ৩. মোড সিলেকশন (বট বনাম ফ্রেন্ড) -->
    <div id="mode-screen" class="game-card hidden animate-intro">
        <h2>গেম মোড বেছে নিন</h2>
        <p>স্বাগতম, <span id="welcome-name" style="color: #2ecc71; font-weight: bold;"></span>!</p>
        <button class="btn" onclick="startBotMatch()">🤖 বট এর সাথে খেলুন (Play with Bot)</button>
        <button class="btn btn-blue" onclick="showRoomOptions()">👥 বন্ধুদের সাথে খেলুন (Friend Match)</button>
    </div>

    <!-- ৪. রুম অপশন (ক্রিয়েট বা জয়েন) -->
    <div id="room-menu-screen" class="game-card hidden animate-intro">
        <h2>ফ্রেন্ড ম্যাচ রুম</h2>
        <button class="btn" onclick="showCreateRoom()">রুম তৈরি করুন (Create Room)</button>
        <button class="btn btn-blue" onclick="showJoinRoom()">রুমে প্রবেশ করুন (Join Room)</button>
        <button class="btn" style="background: #7f8c8d;" onclick="backToMode()">পেছনে যান</button>
    </div>

    <!-- ৫. রুম ক্রিয়েট ও সেটিংস স্ক্রিন (লিডার) -->
    <div id="create-room-screen" class="game-card hidden animate-intro" style="max-height: 90vh; overflow-y: auto;">
        <h2>রুম ও গেম সেটিংস</h2>
        <input type="text" id="room-name-input" placeholder="রুমের নাম (Room Name)">
        <input type="password" id="room-pass-input" placeholder="রুম পাসওয়ার্ড (Password)">
        
        <label style="font-size: 13px; color: #bdc3c7;">প্রতি রাউন্ডের সময় (মিনিট):</label>
        <input type="number" id="room-time-input" placeholder="মিনিট (যেমন: 2 বা 1)" value="1">

        <label style="font-size: 13px; color: #bdc3c7;">মোট রাউন্ড (৫ থেকে ৫০):</label>
        <input type="number" id="room-rounds-input" placeholder="রাউন্ড সংখ্যা (৫-৫০)" value="10" min="5" max="50">

        <label style="font-size: 13px; color: #bdc3c7;">ক্যাটাগরি সমূহ:</label>
        <div style="text-align: left; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 14px;">
            ✅ নাম<br>
            ✅ দেশ, জেলা, শহর, গ্রাম<br>
            ✅ ফুল<br>
            ✅ ফল<br>
            ✅ জিনিস<br>
            <input type="text" id="extra-category" placeholder="+ অতিরিক্ত ক্যাটাগরি যোগ করুন (যদি চায়)">
        </div>

        <button class="btn" onclick="createRoomAction()">রুম খুলুন ও এন্টার করুন</button>
    </div>

    <!-- ৬. জয়েন রুম স্ক্রিন -->
    <div id="join-room-screen" class="game-card hidden animate-intro">
        <h2>রুমে প্রবেশ করুন</h2>
        <input type="text" id="join-room-name" placeholder="রুমের নাম">
        <input type="password" id="join-room-pass" placeholder="রুম পাসওয়ার্ড">
        <button class="btn btn-blue" onclick="joinRoomAction()">রুমে ঢুকুন</button>
        <button class="btn" style="background: #7f8c8d;" onclick="showRoomOptions()">পেছনে যান</button>
    </div>

    <!-- ৭. লবি ও ওয়েটিং স্ক্রিন -->
    <div id="lobby-screen" class="game-card hidden animate-intro">
        <h2>রুম লবি: <span id="lbl-room-name" style="color: #f1c40f;"></span></h2>
        <p>রুম লিডার গেম স্টার্ট করার জন্য অপেক্ষা করুন...</p>
        <div id="players-list" style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin: 15px 0; min-height: 80px;">
            <!-- Player list items -->
        </div>
        <button id="start-match-btn" class="btn hidden" onclick="startTheMatch()">ম্যাচ শুরু করুন (Start Match)</button>
    </div>

</div>

<script>
    const socket = io();
    let userData = { name: '', age: '', gender: '' };
    let currentRoom = '';
    let isLeader = false;

    function showProfileScreen() {
        document.getElementById('intro-screen').classList.add('hidden');
        document.getElementById('profile-screen').classList.remove('hidden');
    }

    function saveProfile() {
        userData.name = document.getElementById('p-name').value.trim();
        userData.age = document.getElementById('p-age').value.trim();
        userData.gender = document.getElementById('p-gender').value;

        if(!userData.name) {
            alert('দয়া করে আপনার নাম লিখুন!');
            return;
        }

        document.getElementById('welcome-name').innerText = userData.name;
        document.getElementById('profile-screen').classList.add('hidden');
        document.getElementById('mode-screen').classList.remove('hidden');
    }

    function startBotMatch() {
        alert('বট মোড লোড হচ্ছে! (আপনাকেসহ মোট ৪ জন খেলবেন)');
        // Bot match logic trigger here
    }

    function showRoomOptions() {
        document.getElementById('mode-screen').classList.add('hidden');
        document.getElementById('room-menu-screen').classList.remove('hidden');
        document.getElementById('create-room-screen').classList.add('hidden');
        document.getElementById('join-room-screen').classList.add('hidden');
    }

    function backToMode() {
        document.getElementById('room-menu-screen').classList.add('hidden');
        document.getElementById('mode-screen').classList.remove('hidden');
    }

    function showCreateRoom() {
        isLeader = true;
        document.getElementById('room-menu-screen').classList.add('hidden');
        document.getElementById('create-room-screen').classList.remove('hidden');
    }

    function showJoinRoom() {
        isLeader = false;
        document.getElementById('room-menu-screen').classList.add('hidden');
        document.getElementById('join-room-screen').classList.remove('hidden');
    }

    function createRoomAction() {
        const rName = document.getElementById('room-name-input').value.trim();
        const rPass = document.getElementById('room-pass-input').value;
        const rTime = document.getElementById('room-time-input').value;
        const rRounds = document.getElementById('room-rounds-input').value;

        if(!rName || !rPass) {
            alert('রুমের নাম এবং পাসওয়ার্ড দিন!');
            return;
        }

        currentRoom = rName;
        socket.emit('create_custom_room', { room: rName, pass: rPass, time: rTime, rounds: rRounds, player: userData });
    }

    function joinRoomAction() {
        const rName = document.getElementById('join-room-name').value.trim();
        const rPass = document.getElementById('join-room-pass').value;

        if(!rName || !rPass) {
            alert('সঠিক রুম নাম ও পাসওয়ার্ড দিন!');
            return;
        }

        currentRoom = rName;
        socket.emit('join_custom_room', { room: rName, pass: rPass, player: userData });
    }

    socket.on('room_joined_success', (data) => {
        document.getElementById('create-room-screen').classList.add('hidden');
        document.getElementById('join-room-screen').classList.add('hidden');
        document.getElementById('lobby-screen').classList.remove('hidden');
        
        document.getElementById('lbl-room-name').innerText = currentRoom;
        if(isLeader) {
            document.getElementById('start-match-btn').classList.remove('hidden');
        }
        updatePlayerListUI(data.players);
    });

    function updatePlayerListUI(players) {
        let listDiv = document.getElementById('players-list');
        listDiv.innerHTML = '<strong>সংযুক্ত খেলোয়াড়বৃন্দ:</strong><br>';
        players.forEach(p => {
            listDiv.innerHTML += `👤 ${p.name} (বয়স: ${p.age})<br>`;
        });
    }

    function startTheMatch() {
        socket.emit('start_host_match', { room: currentRoom });
    }
</script>

</body>
</html>
